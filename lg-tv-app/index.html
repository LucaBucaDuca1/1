<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>MediaFlix</title>
    <meta name="viewport" content="width=1920, height=1080, user-scalable=no">
    <link rel="stylesheet" href="styles/app.css">
</head>
<body>
    <div id="app">
        <!-- Navbar -->
        <nav id="navbar" class="navbar">
            <div class="navbar-brand">MediaFlix</div>
            <div class="navbar-menu" id="menu">
                <div class="menu-item focused" data-action="home">Home</div>
                <div class="menu-item" data-action="movies">Movies</div>
                <div class="menu-item" data-action="series">TV Shows</div>
                <div class="menu-item" data-action="search">Search</div>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main id="main-content">
            <!-- Hero Section -->
            <section id="hero" class="hero hidden">
                <div class="hero-content">
                    <h1 id="hero-title" class="hero-title"></h1>
                    <div id="hero-meta" class="hero-meta"></div>
                    <p id="hero-description" class="hero-description"></p>
                    <div class="hero-buttons">
                        <button class="btn btn-play" id="hero-play">▶ Play</button>
                        <button class="btn btn-info" id="hero-info">ⓘ More Info</button>
                    </div>
                </div>
            </section>

            <!-- Media Rows -->
            <section id="media-rows" class="media-rows"></section>

            <!-- Details View -->
            <section id="details-view" class="details-view hidden">
                <div class="details-content">
                    <button class="btn-back" id="details-back">← Back</button>
                    <h1 id="details-title"></h1>
                    <div id="details-meta" class="details-meta"></div>
                    <p id="details-description"></p>
                    <button class="btn btn-play" id="details-play">▶ Play</button>
                    <div id="details-seasons" class="seasons"></div>
                </div>
            </section>

            <!-- Video Player -->
            <section id="player" class="player hidden">
                <button class="btn-back player-back" id="player-back">← Back</button>
                <video id="video-player" controls>
                    <source id="video-source" src="" type="video/mp4">
                </video>
                <div id="player-info" class="player-info">
                    <h2 id="player-title"></h2>
                </div>
            </section>

            <!-- Loading Indicator -->
            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>Loading...</p>
            </div>
        </main>
    </div>

    <script src="js/webostv.js"></script>
    <script src="js/api.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
